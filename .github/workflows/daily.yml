name: Data refresh and alert

# GitHub runs scheduled jobs LATE, not on the minute — and worst at the top of
# the hour, when every repo's "0 * * * *" fires at once. The previous schedule
# ('0 18' and '0 23') was measured over 2026-09-24..29:
#
#     '0 18 * * 1-5'  started 21:07-22:57 UTC  (3-5h late: AFTER the US close,
#                                                so the "mid-session" refresh
#                                                never happened)
#     '0 23 * * *'    started 00:58-02:24 UTC  (2-3.5h late)
#
# So the hosted site showed the previous session's close all trading day.
# Off-the-hour minutes are queued far less, and several runs across the
# session mean one late or dropped run no longer leaves a whole day stale.
#
# Intraday equity prices no longer depend on this at all — the page reads MSTR
# from api.strategy.com and ASST from a CORS-open quote feed directly (see
# js/issuer.js). These runs keep the files the browser cannot fetch itself
# fresh: Strive's 8-K table, ETF flows, on-chain, and the price history.
on:
  schedule:
    - cron: '17 14,16,18,20 * * 1-5'   # during the US session
    - cron: '43 21 * * 1-5'            # after the close, settled daily bar
    - cron: '11 3 * * *'               # overnight: ETF flows, on-chain, weekends
  workflow_dispatch:        # manual trigger for testing

permissions:
  contents: write           # needed to commit refreshed snapshots

# Late runs bunch up, and two overlapping runs would race on the same data
# files and fail the second push. Queue them instead.
concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Each snapshot is independent — one failing source must not stop the
      # others. bitcoin-data.com in particular rate-limits at 10 req/hour.
      - name: Refresh on-chain snapshot
        continue-on-error: true
        run: node scripts/snapshot-onchain.mjs

      - name: Refresh ETF flows
        continue-on-error: true
        run: node scripts/snapshot-etf.mjs

      - name: Refresh treasury data
        continue-on-error: true
        run: node scripts/snapshot-treasuries.mjs

      # Strive files an 8-K after every bitcoin purchase (~weekly) with a full
      # capital-structure table. It is the only current source for ASST, which
      # has no live API, so it runs on the same cadence as everything else.
      - name: Refresh Strive capital structure
        continue-on-error: true
        run: node scripts/snapshot-asst-8k.mjs

      - name: Compute score and detect band change
        id: check
        run: node scripts/check-alerts.mjs

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && exit 0
          git commit -m "Data refresh — score ${{ steps.check.outputs.score }} (${{ steps.check.outputs.band }})"
          # A commit can land on main while this run is fetching (a manual
          # push, or a queued run). Replay onto it rather than failing the
          # push; on a conflict in a data file the version this run just
          # fetched is the fresher one, so it wins.
          git pull --rebase -X theirs origin main
          git push

      # Only emails on an actual band crossing, not every day. A daily "still
      # ACCUMULATE" message trains you to ignore the alert entirely.
      - name: Email on band change
        if: steps.check.outputs.changed == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Cycle Tide
          to: ${{ secrets.MAIL_TO }}
          subject: "Cycle Tide: ${{ steps.check.outputs.previous }} → ${{ steps.check.outputs.band }}"
          body: |
            The BTC cycle score has crossed a band edge.

              Previous band : ${{ steps.check.outputs.previous }}
              New band      : ${{ steps.check.outputs.band }}
              Score         : ${{ steps.check.outputs.score }}/100
              Confidence    : ${{ steps.check.outputs.confidence }}% of model weight
              Stale data    : ${{ steps.check.outputs.staleweight }}% of weight${{ steps.check.outputs.stalenote && format(' — {0}', steps.check.outputs.stalenote) || ' — none' }}
              BTC price     : $${{ steps.check.outputs.price }}

            https://jv91.github.io/cycle-tide/

            This is a historical risk/reward context tool, not financial advice.
            A band change means conditions moved relative to prior cycles — it
            is not a recommendation to trade.
